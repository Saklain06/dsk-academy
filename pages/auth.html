<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - Elearn</title>
    <meta name="description" content="Sign in or create an account on Elearn to access your courses.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card card">
            <div class="auth-header">
                <a href="../index.html" class="nav-logo">
                    <span class="nav-logo-icon">🎓</span>
                    <span class="nav-logo-text">Elearn</span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to access your courses or create a new account</p>
            </div>

            <div class="auth-tabs" data-tabs>
                <div class="tabs">
                    <button class="tab-btn active" data-tab-btn="login">Sign In</button>
                    <button class="tab-btn" data-tab-btn="register">Sign Up</button>
                </div>

                <div class="tab-panel active" data-tab-panel="login">
                    <form class="auth-form" data-validate>
                        <div class="form-group">
                            <label class="label">Email</label>
                            <input type="email" class="input" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="label">Password</label>
                            <input type="password" class="input" placeholder="Enter your password" required>
                        </div>
                        <div class="auth-options">
                            <label class="checkbox-label">
                                <input type="checkbox">
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-full btn-lg">Sign In</button>
                        <p class="auth-footer">Don't have an account? <a href="#" data-switch-tab="register">Sign up</a></p>
                    </form>
                </div>

                <div class="tab-panel" data-tab-panel="register">
                    <form class="auth-form" data-validate>
                        <div class="form-group">
                            <label class="label">Full Name</label>
                            <input type="text" class="input" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label class="label">Email</label>
                            <input type="email" class="input" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="label">Password</label>
                            <input type="password" class="input" placeholder="Create a password" minlength="8" required>
                        </div>
                        <div class="form-group">
                            <label class="label">Confirm Password</label>
                            <input type="password" class="input" placeholder="Confirm your password" data-match="[type='password']:first-of-type" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-full btn-lg">Sign Up</button>
                        <p class="auth-footer">Already have an account? <a href="#" data-switch-tab="login">Sign in</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
