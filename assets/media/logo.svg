<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54" fill="none">
  <!-- Brand Icon Badge -->
  <g transform="translate(4, 5)">
    <!-- Rounded Background Icon -->
    <rect width="44" height="44" rx="12" fill="url(#brandGrad)" />
    <!-- Graduation Cap / Diamond Emblem -->
    <path d="M22 12L34 18.5L22 25L10 18.5L22 12Z" fill="#FFFFFF" />
    <path d="M15 21.5V28C15 28 17.5 31.5 22 31.5C26.5 31.5 29 28 29 28V21.5L22 25.5L15 21.5Z" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Spark / Tassel -->
    <circle cx="33" cy="23" r="2" fill="#26D9A3" />
    <path d="M33 24V28" stroke="#26D9A3" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(56, 12)">
    <!-- DSK -->
    <text x="0" y="20" font-family="'Heebo', 'Roboto', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="#055BAD">
      DSK
    </text>
    <!-- Dot highlight -->
    <circle cx="48" cy="18" r="3" fill="#26D9A3" />
    <!-- ACADEMY -->
    <text x="56" y="20" font-family="'Heebo', 'Roboto', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.3" fill="#1D1D1D">
      ACADEMY
    </text>
    <!-- Subtitle tagline -->
    <text x="1" y="32" font-family="'Roboto', 'Inter', sans-serif" font-weight="600" font-size="8" letter-spacing="2.2" fill="#71717A">
      FUTURE OF LEARNING
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#055BAD" />
      <stop offset="100%" stop-color="#02386E" />
    </linearGradient>
  </defs>
</svg>
